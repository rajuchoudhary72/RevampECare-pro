# -----------------------------
# ??  Gradle Performance Tuning
# -----------------------------

# Use more memory for Gradle but within limits (Mac M1 8GB)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50

# Run Gradle in daemon mode (speeds up builds)
org.gradle.daemon=true

# Enable parallel project execution
org.gradle.parallel=true

# Configure projects on demand (only what?s needed)
org.gradle.configureondemand=true

# Enable Gradle build caching
org.gradle.caching=true

# Limit worker threads to avoid memory pressure
org.gradle.workers.max=2

# -----------------------------
# ? Android Configuration
# -----------------------------

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Reduce unnecessary resource merging overhead
android.enableResourceOptimizations=true

# -----------------------------
# ? Kotlin & Compiler
# -----------------------------

kotlin.code.style=official

# Avoid incremental issues (optional)
kotlin.incremental=true
kotlin.incremental.java=true

# -----------------------------
# ? Misc
# -----------------------------

# Faster file system watching (speeds up sync)
org.gradle.vfs.watch=true

# Disable build scan auto-upload
systemProp.gradle.enterprise.test.retry=false
